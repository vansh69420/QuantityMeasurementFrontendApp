<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quantity Measurement</title>
  <link rel="stylesheet" href="/css/app.css" />
  <script defer src="/js/apiClient.js"></script>
  <script defer src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <h1 class="topbar__title">Welcome To Quantity Measurement</h1>
      <div class="topbar__meta" id="userMeta"></div>
    </div>
  </header>

  <main class="page">
    <section class="card shell">
      <div class="shell__section">
        <div class="sectionTitle">CHOOSE TYPE</div>

        <div class="typeGrid" id="typeGrid">
          <!-- Rendered by JS -->
        </div>
      </div>

      <div class="shell__section">
        <div class="sectionTitle">CHOOSE ACTION</div>

        <div class="segmented" id="actionSegment">
          <!-- Rendered by JS -->
        </div>
      </div>

      <div class="shell__section">
        <div id="actionArea"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" aria-live="polite"></div>
</body>
</html>
