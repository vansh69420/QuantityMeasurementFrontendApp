<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Auth - Quantity Measurement</title>
  <link rel="stylesheet" href="/css/auth.css" />
  <script defer src="/js/apiClient.js"></script>
  <script defer src="/js/auth.js"></script>
</head>
<body>
  <main class="authPage">
    <section class="authShell">
      <aside class="authShell__left">
        <div class="illustration">
          <div class="illustration__circle">
            <img class="illustration__centerIcon" src="/assets/measurement.svg" alt="Measurement" />
            </div>
          <div class="illustration__iconRow">
            <img class="illustration__icon" src="/assets/length.svg" alt="Length"/>
            <img class="illustration__icon" src="/assets/weight.svg" alt="Weight"/>
            <img class="illustration__icon" src="/assets/temperature.svg" alt="Temperature"/>
            <img class="illustration__icon" src="/assets/volume.svg" alt="Volume"/>
          </div>
          <div class="illustration__caption">QUANTITY MEASUREMENT</div>
        </div>
      </aside>

      <section class="authShell__right">
        <div class="authCard">
          <div class="authTabs">
            <button class="authTabs__tab isActive" id="tabLogin" type="button">LOGIN</button>
            <button class="authTabs__tab" id="tabSignup" type="button">SIGNUP</button>
          </div>

          <div class="tabUnderline">
            <div class="tabUnderline__bar" id="tabUnderlineBar"></div>
          </div>

          <div class="authBody">
            <!-- LOGIN -->
            <form id="loginForm" class="authForm isActive authForm--login" autocomplete="on">
              <label class="field">
                <span class="field__label">Email Id / Username</span>
                <input class="field__input" name="login" type="text" required />
              </label>

              <label class="field">
                <span class="field__label">Password</span>
                <div class="field__password">
                  <input class="field__input" id="loginPassword" name="password" type="password" required />
                  <button class="field__eye" type="button" id="loginEyeBtn" aria-label="Toggle password">
                    👁
                  </button>
                </div>
              </label>

              <div class="authActions">
                <button class="btn btnPrimary" type="submit">Login</button>
              </div>

              <div class="loginExtras" aria-hidden="true">
                <div class="meter">
                    <div class="meter__track">
                    <div class="meter__marker"></div>
                    </div>

                    <div class="meter__example" id="meterExample">1 feet = 12 inch</div>
                    <div class="meter__sub">Secured login</div>
                </div>

                <div class="loginChips">
                    <div class="chip">
                    <img class="chip__icon" src="/assets/length.svg" alt="Length" />
                    <span class="chip__text">Length</span>
                    </div>
                    <div class="chip">
                    <img class="chip__icon" src="/assets/weight.svg" alt="Weight" />
                    <span class="chip__text">Weight</span>
                    </div>
                    <div class="chip">
                    <img class="chip__icon" src="/assets/temperature.svg" alt="Temperature" />
                    <span class="chip__text">Temperature</span>
                    </div>
                    <div class="chip">
                    <img class="chip__icon" src="/assets/volume.svg" alt="Volume" />
                    <span class="chip__text">Volume</span>
                    </div>
                </div>
                </div>

              <div class="authMessage" id="loginMessage"></div>
            </form>

            <!-- SIGNUP -->
            <form id="signupForm" class="authForm" autocomplete="on">
              <label class="field">
                <span class="field__label">Username</span>
                <input class="field__input" name="username" type="text" required />
              </label>

              <label class="field">
                <span class="field__label">Email Id</span>
                <input class="field__input" name="email" type="email" required />
              </label>

              <label class="field">
                <span class="field__label">Password</span>
                <div class="field__password">
                  <input class="field__input" id="signupPassword" name="password" type="password" required />
                  <button class="field__eye" type="button" id="signupEyeBtn" aria-label="Toggle password">
                    👁
                  </button>
                </div>
              </label>

              <div class="authActions">
                <button class="btn btnDanger" type="submit">Signup</button>
              </div>

              <div class="authMessage" id="signupMessage"></div>
            </form>
          </div>
        </div>
      </section>
    </section>
  </main>
</body>
</html>
