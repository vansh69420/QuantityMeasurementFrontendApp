<div class="authPage">
  <div class="bgOrb orbOne"></div>
  <div class="bgOrb orbTwo"></div>
  <div class="bgGrid"></div>

  <div class="authAccentGroup">
    <div class="authAccentChip authChipOne">
      <mat-icon>straighten</mat-icon>
      <span>Length</span>
    </div>
    <div class="authAccentChip authChipTwo isTeal">
      <mat-icon>scale</mat-icon>
      <span>Weight</span>
    </div>
    <div class="authAccentChip authChipThree">
      <mat-icon>science</mat-icon>
      <span>Volume</span>
    </div>
  </div>

  <mat-card class="authCard">
    <div class="brandBlock">
      <div class="brandBadge">
        <mat-icon>straighten</mat-icon>
      </div>
      <div>
        <div class="eyebrow">QUANTITY MEASUREMENT</div>
        <h2>Welcome back</h2>
                <p class="heroText">Sign in to continue.</p>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="authForm">
      <mat-form-field appearance="outline" class="full">
        <mat-label>Email / Username</mat-label>
        <input matInput formControlName="login" />
        <mat-error *ngIf="form.controls.login.invalid">Required</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full">
        <mat-label>Password</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" />
        <button
          mat-icon-button
          matSuffix
          type="button"
          class="iconBtn"
          [attr.aria-label]="hidePassword ? 'Show password' : 'Hide password'"
          (click)="togglePasswordVisibility()">
          <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <mat-error *ngIf="form.controls.password.invalid">Required</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" class="full submitBtn" [disabled]="form.invalid || busy">
        <span *ngIf="!busy">Login</span>
        <span *ngIf="busy">Signing in...</span>
      </button>

      <div class="msg error" *ngIf="error">{{ error }}</div>
    </form>

    <div class="footerText">
      <span>New user?</span>
      <a routerLink="/register">Create account</a>
    </div>
  </mat-card>
</div>
