<div class="drawerHeader">
  <div class="drawerTitle">
    <mat-icon>history</mat-icon>
    <span>History</span>
  </div>

  <button mat-stroked-button class="softBtn" (click)="onRefreshClick()" [disabled]="busy">
    Refresh
  </button>
</div>

<div class="drawerBody">
  <div class="skeletonList" *ngIf="busy">
    <div class="skeletonRow" *ngFor="let _ of skeletonRows">
      <div class="skeletonLine title"></div>
      <div class="skeletonLine short"></div>
      <div class="skeletonLine medium"></div>
    </div>
  </div>

  <div class="drawerHint" *ngIf="!busy && !items?.length">
    No history yet. Your recent measurement operations will appear here.
  </div>

  <div class="historyStack" *ngIf="!busy && items?.length">
    <div class="historyEntry" *ngFor="let it of items; trackBy: trackByOpId">
      <div class="rowTitle">{{ formatTitle(it) }}</div>
      <div class="rowSub">{{ it.timestampUtc || '' }}</div>
      <div class="rowSub errorText" *ngIf="it.hasError">
        Error: {{ it.errorMessage }}
      </div>
    </div>
  </div>
</div>
